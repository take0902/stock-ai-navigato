<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stock AI Navigator</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#172033;background:#f4f6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef2ff,#fff4fb 45%,#eafff7);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#6455e8,#c443da 55%,#15bfa0);color:white;border-radius:28px;padding:25px;box-shadow:0 18px 45px #6956d833}.hero h1{margin:0;font-size:clamp(26px,5vw,44px)}.hero p{opacity:.9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{border:0;border-radius:14px;padding:13px;background:white;box-shadow:0 6px 20px #33415517;font-size:16px}.toolbar input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fffffff0;border-radius:22px;padding:18px;box-shadow:0 10px 30px #33415512}.summary{grid-column:span 4}.chart{grid-column:span 8}.forecast{grid-column:span 4}.full{grid-column:1/-1}.price{font-size:32px;font-weight:800}.up{color:#e5395f}.down{color:#168a71}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#eeeafe;color:#5f48d8;font-weight:700}.score{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#6553e8 calc(var(--score)*1%),#e9eafb 0);position:relative;margin:auto}.score:after{content:"";position:absolute;inset:11px;background:white;border-radius:50%}.score b{z-index:1;font-size:26px}.prob{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.prob div{padding:14px 7px;border-radius:16px;text-align:center;font-weight:800}.prob .p1{background:#ffe4eb;color:#c92b53}.prob .p2{background:#fff1cf;color:#9a6700}.prob .p3{background:#dff1ff;color:#2169a9}canvas{width:100%;height:340px;border-radius:16px;background:#fbfcff}.ranges{display:grid;gap:10px}.range{padding:13px;border-radius:14px;background:linear-gradient(90deg,#f0edff,#effffb)}ul{padding-left:20px;line-height:1.8}.note{font-size:12px;color:#667085;background:#f7f8fc;border-radius:12px;padding:11px}.source{font-size:12px;color:#667085}@media(max-width:780px){.summary,.chart,.forecast{grid-column:1/-1}.wrap{padding:10px}.hero{border-radius:20px;padding:20px}canvas{height:280px}}
</style></head><body><main class="wrap"><section class="hero"><h1>Stock AI Navigator</h1><p>無料データで日本株を分析。フォルダ不要のiPhone簡単アップロード版です。</p></section><div class="toolbar"><input id="search" placeholder="証券コードまたは会社名"><select id="stock"></select><select id="period"><option value="30">1か月</option><option value="90" selected>3か月</option><option value="180">6か月</option></select></div><section class="grid"><article class="card summary"><span class="badge" id="ticker"></span><h2 id="name"></h2><div class="price" id="price"></div><div id="change"></div><p class="source" id="source"></p><div class="score" id="scoreRing"><b id="score"></b></div><p style="text-align:center;font-weight:700">AI総合評価</p></article><article class="card chart"><h2>株価チャート</h2><canvas id="chart"></canvas></article><article class="card forecast"><h2>直近株価予想</h2><div class="prob"><div class="p1">上昇<br><span id="up"></span>%</div><div class="p2">横ばい<br><span id="flat"></span>%</div><div class="p3">下落<br><span id="down"></span>%</div></div><h3>予想レンジ</h3><div class="ranges" id="ranges"></div></article><article class="card full"><h2>分析根拠</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px"><div><h3>プラス材料</h3><ul id="reasons"></ul></div><div><h3>注意点</h3><ul id="cautions"></ul></div></div><div class="note">表示される確率は、移動平均・RSI・MACD・出来高・ATRを点数化した評価値です。将来の値動きを保証する統計的確率ではありません。投資判断は利用者自身の責任で行ってください。</div></article></section></main><script>
let DB,cur;const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:1}).format(n);async function load(){DB=await fetch('stocks.json?'+Date.now()).then(r=>r.json());const s=document.querySelector('#stock');DB.stocks.forEach((x,i)=>s.add(new Option(`${x.code} ${x.name}`,i)));s.onchange=()=>show(+s.value);document.querySelector('#period').onchange=()=>show(+s.value);document.querySelector('#search').oninput=e=>{const q=e.target.value.toLowerCase();const i=DB.stocks.findIndex(x=>(x.code+x.name).toLowerCase().includes(q));if(i>=0){s.value=i;show(i)}};show(0)}function show(i){cur=DB.stocks[i];ticker.textContent=cur.code;name.textContent=cur.name;price.textContent=yen(cur.price);change.textContent=`${cur.change>=0?'+':''}${cur.change}円（${cur.changePct>=0?'+':''}${cur.changePct}%）`;change.className=cur.change>=0?'up':'down';source.textContent=`データ源：${cur.source}　更新：${new Date(cur.updatedAt).toLocaleString('ja-JP')}`;score.textContent=cur.score+'点';scoreRing.style.setProperty('--score',cur.score);up.textContent=cur.probabilities.up;flat.textContent=cur.probabilities.flat;down.textContent=cur.probabilities.down;ranges.innerHTML=[['翌営業日','next'],['5営業日','five'],['20営業日','twenty']].map(([a,k])=>`<div class="range"><b>${a}</b><br>${yen(cur.forecasts[k].low)} ～ ${yen(cur.forecasts[k].high)}</div>`).join('');reasons.innerHTML=(cur.reasons.length?cur.reasons:['明確なプラス材料は検出されませんでした']).map(x=>`<li>${x}</li>`).join('');cautions.innerHTML=(cur.cautions.length?cur.cautions:['特段の警戒条件は検出されませんでした']).map(x=>`<li>${x}</li>`).join('');draw()}function draw(){const cv=chart,c=cv.getContext('2d'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;c.scale(dpr,dpr);c.clearRect(0,0,w,h);const days=+period.value,data=cur.history.slice(-days),pad=34,min=Math.min(...data.map(x=>x.low)),max=Math.max(...data.map(x=>x.high)),X=i=>pad+i*(w-2*pad)/(data.length-1),Y=v=>h-pad-(v-min)*(h-2*pad)/(max-min||1);c.strokeStyle='#e7e9f4';for(let i=0;i<5;i++){let y=pad+i*(h-2*pad)/4;c.beginPath();c.moveTo(pad,y);c.lineTo(w-pad,y);c.stroke()}data.forEach((x,i)=>{const xx=X(i),up=x.close>=x.open;c.strokeStyle=up?'#e33f65':'#159278';c.fillStyle=c.strokeStyle;c.beginPath();c.moveTo(xx,Y(x.high));c.lineTo(xx,Y(x.low));c.stroke();const y=Math.min(Y(x.open),Y(x.close)),hh=Math.max(2,Math.abs(Y(x.open)-Y(x.close)));c.fillRect(xx-2.5,y,5,hh)});[['sma5','#9b51e0'],['sma25','#2f80ed']].forEach(([k,col])=>{c.strokeStyle=col;c.lineWidth=2;c.beginPath();data.forEach((x,i)=>{const y=Y(x[k]);i?c.lineTo(X(i),y):c.moveTo(X(i),y)});c.stroke()})}load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
